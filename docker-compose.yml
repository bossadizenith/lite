services:
  lite-db:
    image: postgres:16-alpine
    container_name: lite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lite
    ports:
      - "5439:5432"
    volumes:
      - lite_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lite"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lite_data:
